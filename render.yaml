# Blueprint do Render: cria o serviço web. O PostgreSQL fica no Neon (o gratuito do Render expira em 30 dias).
# No painel do Render: New > Blueprint > selecione este repositório.

services:
  - type: web
    name: agendafacil
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: TZ_APP
        value: America/Sao_Paulo
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_PASSWORD
        sync: false   # informe no painel; usada para criar os usuários de demonstração
      - key: DATABASE_URL
        sync: false   # connection string do Neon (postgresql://...?sslmode=require)
