# Blueprint do Render: cria o banco PostgreSQL e o serviço web.
# No painel do Render: New > Blueprint > selecione este repositório.
databases:
  - name: agendafacil-db
    plan: free
    databaseName: agendafacil
    user: agendafacil
    postgresMajorVersion: "16"

services:
  - type: web
    name: agendafacil
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: TZ_APP
        value: America/Sao_Paulo
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_PASSWORD
        sync: false   # informe no painel; usada para criar os usuários de demonstração
      - key: DATABASE_URL
        fromDatabase:
          name: agendafacil-db
          property: connectionString
