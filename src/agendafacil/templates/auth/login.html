{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="painel-form">
  <h1>Entrar</h1>
  <form method="post" novalidate data-validar>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" value="{{ email }}">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required autocomplete="current-password">
    <button type="submit" class="botao botao-bloco">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
