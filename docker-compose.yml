services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agendafacil
      POSTGRES_PASSWORD: agendafacil
      POSTGRES_DB: agendafacil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendafacil"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
