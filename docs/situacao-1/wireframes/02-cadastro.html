<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wireframe: Cadastro</title><link rel="stylesheet" href="wireframe.css"></head><body>
<header class="top"><strong>[LOGO] AgendaFácil</strong><nav><span>Serviços</span><span>Entrar</span><span>Cadastrar</span></nav></header><main>
<div class="box" style="max-width:420px;margin:auto">
<h2>Criar conta</h2>
<div class="field"><label>Nome completo *</label><div class="input"></div></div>
<div class="field"><label>E-mail *</label><div class="input"></div><span class="note">"Este e-mail já está cadastrado." aparece abaixo do campo</span></div>
<div class="field"><label>Telefone</label><div class="input"></div></div>
<div class="field"><label>Senha * (mín. 8 caracteres)</label><div class="input"></div></div>
<div class="field"><label>Confirmar senha *</label><div class="input"></div><span class="note">"As senhas não conferem" em tempo real (JS)</span></div>
<span class="btn">Criar conta</span> <span class="btn sec">Cancelar</span>
</div>
</main></body></html>
